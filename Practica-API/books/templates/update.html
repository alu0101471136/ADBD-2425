{% extends 'base.html' %}

{% block content %}
    <h1>Update Book</h1>
    <form method="post">
        <p>
            <label for="title">Title</label>
            <input type="text" name="title" value="{{ book[1] }}" required>
        </p>
        <p>
            <label for="author">Author</label>
            <input type="text" name="author" value="{{ book[2] }}" required>
        </p>
        <p>
            <label for="pages_num">Number of pages</label>
            <input type="number" name="pages_num" value="{{ book[3] }}" required>
        </p>
        <p>
            <label for="review">Review</label>
            <textarea name="review" rows="5" cols="40" required>{{ book[4] }}</textarea>
        </p>
        <p>
            <button type="submit">Update</button>
        </p>
    </form>
{% endblock %}
